name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v1.1.0) — must match an existing draft release'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # upload assets to the draft release
      packages: write     # push to GHCR
      attestations: write # upload provenance attestation
      id-token: write     # OIDC token for attestation signing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          V="${{ inputs.version }}"
          SEMVER="${V#v}"
          MINOR="${SEMVER%.*}"
          echo "ref=${V}"         >> $GITHUB_OUTPUT
          echo "semver=${SEMVER}" >> $GITHUB_OUTPUT
          echo "minor=${MINOR}"   >> $GITHUB_OUTPUT

      # Fail before the long build if the draft release doesn't exist yet.
      # Create it in the GitHub UI (Releases → Draft a new release) first.
      - name: Verify draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ steps.ver.outputs.ref }}" \
               --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "::error::No release found for ${{ steps.ver.outputs.ref }}."
            echo "::error::Create a draft release in the GitHub UI before running this workflow."
            exit 1
          fi

      # QEMU lets Buildx cross-compile the arm64 image on the amd64 runner.
      # The Rust compilation step will be slow under emulation (~20 min) but
      # only runs at release time, not on every push.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Use type=raw tags so the metadata step works even when the git tag
      # does not yet exist (it is created when the user publishes the draft).
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tusshare
          tags: |
            type=raw,value=${{ steps.ver.outputs.semver }}
            type=raw,value=${{ steps.ver.outputs.minor }}
            type=raw,value=latest

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Attaches a signed SLSA provenance attestation to the image in GHCR.
      # Lets users verify the image was built from this exact commit by GitHub
      # Actions and not tampered with after the fact.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/tusshare
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Create deployment bundle
        env:
          VERSION: ${{ steps.ver.outputs.semver }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/tusshare
        run: |
          mkdir -p release-bundle/backend/sql

          # Patch docker-compose.yml: replace the local `build: .` reference
          # with the published image so users don't need the source tree.
          python3 -c "
          import os
          src = open('docker-compose.yml').read()
          src = src.replace(
              '    build: .',
              '    image: ' + os.environ['IMAGE'] + ':' + os.environ['VERSION']
          )
          open('release-bundle/docker-compose.yml', 'w').write(src)
          "

          cp .env.example release-bundle/
          cp generate-env.py release-bundle/
          cp backend/sql/init-app-user.sh release-bundle/backend/sql/

          tar -czf "tusshare-${VERSION}.tar.gz" -C release-bundle .
          cd release-bundle && zip -r "../tusshare-${VERSION}.zip" .

      # Upload bundles to the draft release. Publishing — and the protected
      # git tag creation — is done manually from the GitHub UI, where the
      # repo owner's credentials satisfy the tag-protection rule.
      - name: Upload bundles to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMVER: ${{ steps.ver.outputs.semver }}
          REF: ${{ steps.ver.outputs.ref }}
        run: |
          gh release upload "${REF}" \
            "tusshare-${SEMVER}.tar.gz" \
            "tusshare-${SEMVER}.zip" \
            --repo "${{ github.repository }}" \
            --clobber
