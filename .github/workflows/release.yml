name: Release

on:
  # Primary: run manually from the Actions tab with a version input.
  # The workflow creates a draft, builds, uploads assets, then publishes —
  # which creates the protected tag via the Releases API (bypasses the tag
  # protection rule that blocks direct git pushes).
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.1.0)'
        required: true
        type: string

  # Fallback: tag-push path still works if a tag is created externally.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create GitHub Release
      packages: write     # push to GHCR
      attestations: write # upload provenance attestation
      id-token: write     # OIDC token for attestation signing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Resolve the version from input (workflow_dispatch) or tag (push).
      # Outputs:
      #   ver.ref    — full ref, e.g. v1.1.0
      #   ver.semver — bare semver, e.g. 1.1.0
      #   ver.minor  — major.minor, e.g. 1.1
      - name: Resolve version
        id: ver
        run: |
          V="${{ inputs.version || github.ref_name }}"
          SEMVER="${V#v}"
          MINOR="${SEMVER%.*}"
          echo "ref=${V}"       >> $GITHUB_OUTPUT
          echo "semver=${SEMVER}" >> $GITHUB_OUTPUT
          echo "minor=${MINOR}"  >> $GITHUB_OUTPUT

      # Create the release as a draft immediately so assets can be uploaded to
      # it before the release is published. GitHub treats published releases as
      # immutable — asset uploads are rejected once a release is no longer a
      # draft. The final step sets draft: false to publish after assets are ready.
      #
      # target_commitish tells GitHub what commit to tag at publish time.
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.ref }}
          name: ${{ steps.ver.outputs.ref }}
          target_commitish: ${{ github.sha }}
          draft: true
          make_latest: false

      # QEMU lets Buildx cross-compile the arm64 image on the amd64 runner.
      # The Rust compilation step will be slow under emulation (~20 min) but
      # only runs at release time, not on every push.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Use type=raw tags so the metadata step works even when the git tag
      # does not yet exist (workflow_dispatch path; tag is created at publish).
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tusshare
          tags: |
            type=raw,value=${{ steps.ver.outputs.semver }}
            type=raw,value=${{ steps.ver.outputs.minor }}
            type=raw,value=latest

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Attaches a signed SLSA provenance attestation to the image in GHCR.
      # Lets users verify the image was built from this exact commit by GitHub
      # Actions and not tampered with after the fact.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/tusshare
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Create deployment bundle
        env:
          VERSION: ${{ steps.ver.outputs.semver }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/tusshare
        run: |
          mkdir -p release-bundle/backend/sql

          # Patch docker-compose.yml: replace the local `build: .` reference
          # with the published image so users don't need the source tree.
          python3 -c "
          import os
          src = open('docker-compose.yml').read()
          src = src.replace(
              '    build: .',
              '    image: ' + os.environ['IMAGE'] + ':' + os.environ['VERSION']
          )
          open('release-bundle/docker-compose.yml', 'w').write(src)
          "

          cp .env.example release-bundle/
          cp generate-env.py release-bundle/
          cp backend/sql/init-app-user.sh release-bundle/backend/sql/

          tar -czf "tusshare-${VERSION}.tar.gz" -C release-bundle .
          cd release-bundle && zip -r "../tusshare-${VERSION}.zip" .

      # Upload assets to the draft release and publish it.
      # Uses RELEASE_TOKEN (a fine-grained PAT for the repo owner) rather than
      # GITHUB_TOKEN because the tag-protection rule blocks github-actions[bot]
      # from creating the git tag when the draft is published. The PAT runs as
      # the repo owner, who is allowed to create protected tags via the
      # Releases API.
      - name: Publish release with assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ steps.ver.outputs.ref }}
          name: ${{ steps.ver.outputs.ref }}
          draft: false
          make_latest: true
          files: |
            tusshare-${{ steps.ver.outputs.semver }}.tar.gz
            tusshare-${{ steps.ver.outputs.semver }}.zip
          body: |
            ## Quick start

            1. Download and extract the deployment bundle (`.tar.gz` or `.zip`) below
            2. Run `python generate-env.py` and enter your domain when prompted
            3. `docker compose up -d`

            The image is also available directly:
            ```
            docker pull ghcr.io/${{ github.repository_owner }}/tusshare:${{ steps.ver.outputs.semver }}
            ```

            See the [README](https://github.com/${{ github.repository }}#readme) for full setup and configuration docs.
