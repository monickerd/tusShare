services:
  tusshare:
    build: .
    container_name: tusshare
    ports:
      - "127.0.0.1:9050:8080"
    volumes:
      - tusshare_data:/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9050/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tusshare_data:
    driver: local
