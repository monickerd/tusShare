services:
  postgres:
    image: postgres:16-alpine
    container_name: tusshare_postgres
    environment:
      POSTGRES_DB: tusshare
      POSTGRES_USER: tusshare
      POSTGRES_PASSWORD: ${TUSSHARE_PG_PASSWORD:-tusshare}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tusshare -d tusshare"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tusshare:
    build: .
    container_name: tusshare
    ports:
      - "127.0.0.1:9050:8080"
    volumes:
      - tusshare_data:/data
    environment:
      # First-run bootstrap: set TUSSHARE_SUPERUSER_URL in .env to create the
      # sensitive_config schema automatically on startup. Requires a PostgreSQL
      # superuser connection string. In this Docker setup, POSTGRES_USER is the
      # superuser, so the URL mirrors DATABASE_URL with the same credentials.
      #
      # Add to .env before first startup, then remove — ignored once the schema
      # exists and safe to leave in if preferred (no effect after bootstrap).
      #
      # Example .env entry:
      #   TUSSHARE_SUPERUSER_URL=postgresql://tusshare:PASSWORD@postgres:5432/tusshare
      #
      # To bootstrap without restarting a running stack:
      #   TUSSHARE_SUPERUSER_URL=postgresql://tusshare:PASSWORD@postgres:5432/tusshare \
      #   docker compose run --rm tusshare \
      #   python -c "import asyncio,os; from pathlib import Path; \
      #   from app.sensitive_config import _bootstrap; \
      #   asyncio.run(_bootstrap(os.environ['TUSSHARE_SUPERUSER_URL'],'tusshare',Path('/data')))"
      TUSSHARE_SUPERUSER_URL: ${TUSSHARE_SUPERUSER_URL:-}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  tusshare_data:
    driver: local
  postgres_data:
    driver: local
