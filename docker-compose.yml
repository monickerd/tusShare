# ─── EGRESS FILTERING ────────────────────────────────────────────────────────
# The postgres service is on backend_internal (internal: true), which means
# Docker refuses to route its traffic to/from external IPs — it can never phone
# home regardless of what a compromised library does.
#
# The app container sits on both networks so it can reach postgres, but also
# needs outbound internet access for cloud storage, OIDC, etc.  Per-destination
# egress filtering for the app requires iptables rules applied on the Docker
# host *after* `docker compose up`.  Example workflow:
#
#   # Get the app container's IP on the external bridge:
#   APP_IP=$(docker inspect tusshare \
#     --format '{{(index .NetworkSettings.Networks "filexfer_app_external").IPAddress}}')
#
#   # Default-deny all outbound from the app container:
#   iptables -I DOCKER-USER -s "$APP_IP" -j DROP
#
#   # Allow established/related replies back in:
#   iptables -I DOCKER-USER -s "$APP_IP" -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
#
#   # Always required — pgbouncer (Docker assigns the IP; adjust if you pin it):
#   PGBOUNCER_IP=$(docker inspect tusshare_pgbouncer \
#     --format '{{(index .NetworkSettings.Networks "filexfer_backend_internal").IPAddress}}')
#   iptables -I DOCKER-USER -s "$APP_IP" -d "$PGBOUNCER_IP" -p tcp --dport 6432 -j ACCEPT
#
#   # Only needed if TUSSHARE_SUPERUSER_URL is used (bootstrap). The superuser
#   # URL bypasses pgbouncer and connects directly to postgres as the pg superuser.
#   PG_IP=$(docker inspect tusshare_postgres \
#     --format '{{(index .NetworkSettings.Networks "filexfer_backend_internal").IPAddress}}')
#   iptables -I DOCKER-USER -s "$APP_IP" -d "$PG_IP" -p tcp --dport 5432 -j ACCEPT
#
# Uncomment blocks below for each optional integration you enable:
#
#   # Redis (if you add a Redis service for caching/sessions):
#   # iptables -I DOCKER-USER -s "$APP_IP" -d <redis-ip>/32 -p tcp --dport 6379 -j ACCEPT
#
#   # LDAP / LDAPS:
#   # iptables -I DOCKER-USER -s "$APP_IP" -d <ldap-host>/32 -p tcp --dport 389 -j ACCEPT
#   # iptables -I DOCKER-USER -s "$APP_IP" -d <ldap-host>/32 -p tcp --dport 636 -j ACCEPT
#
#   # OIDC provider (e.g. Okta, Azure AD, Dex) — HTTPS only:
#   # iptables -I DOCKER-USER -s "$APP_IP" -d <oidc-host>/32 -p tcp --dport 443 -j ACCEPT
#
#   # SMTP relay (for email notifications):
#   # iptables -I DOCKER-USER -s "$APP_IP" -d <smtp-relay>/32 -p tcp --dport 587 -j ACCEPT
#
#   # AWS S3 (adjust prefix list for your region — these cover us-east-1):
#   # iptables -I DOCKER-USER -s "$APP_IP" -d 52.216.0.0/15 -p tcp --dport 443 -j ACCEPT
#   # iptables -I DOCKER-USER -s "$APP_IP" -d 54.231.0.0/17 -p tcp --dport 443 -j ACCEPT
#
#   # Azure Blob Storage:
#   # iptables -I DOCKER-USER -s "$APP_IP" -d 52.239.0.0/16 -p tcp --dport 443 -j ACCEPT
#
#   # Google Cloud Storage:
#   # iptables -I DOCKER-USER -s "$APP_IP" -d 142.250.0.0/15 -p tcp --dport 443 -j ACCEPT
#
#   # SIEM / webhook endpoint:
#   # iptables -I DOCKER-USER -s "$APP_IP" -d <siem-host>/32 -p tcp --dport 443 -j ACCEPT
#
# Note: Docker's embedded DNS (127.0.0.11) is handled inside the container's
# network namespace and is not subject to DOCKER-USER chain rules.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  # postgres lives here and nowhere else — no internet route.
  backend_internal:
    internal: true
  # app sits on both networks; apply iptables egress rules above to restrict
  # outbound from the app container to only the destinations it legitimately needs.
  app_external:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: tusshare_postgres
    networks:
      - backend_internal
    environment:
      POSTGRES_DB: tusshare
      # postgres is the cluster superuser — used only for bootstrap/admin tasks.
      # The app connects as the separate tusshare user (created by init-app-user.sh).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TUSSHARE_PG_SUPERUSER_PASSWORD:-changeme}
      # Passed through so the init script can create the tusshare app user.
      TUSSHARE_PG_PASSWORD: ${TUSSHARE_PG_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init-app-user.sh:/docker-entrypoint-initdb.d/init-app-user.sh
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tusshare"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: tusshare_pgbouncer
    networks:
      - backend_internal
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: tusshare
      # Must match the app user created by init-app-user.sh (TUSSHARE_APP_USER,
      # defaults to "tusshare").
      DB_USER: tusshare
      DB_PASSWORD: ${TUSSHARE_PG_PASSWORD:-changeme}
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "25"
      MAX_CLIENT_CONN: "200"
      AUTH_TYPE: md5
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tusshare:
    build: .
    container_name: tusshare
    networks:
      - backend_internal
      - app_external
    ports:
      - "127.0.0.1:9050:8080"
    volumes:
      - tusshare_data:/data
      # frontend-src (baked into the image) is copied into a tmpfs-backed
      # /app/frontend by the entrypoint on every container start.  SRI injection
      # then rewrites index.html in that tmpfs.  No named volume is needed, so
      # plain "docker compose down && docker compose up --build -d" is sufficient
      # to pick up frontend changes.
    tmpfs:
      # Read-only root filesystem (below) still needs writable scratch space.
      # Python uses /tmp for temp files; /var/tmp for longer-lived scratch.
      - /tmp:mode=1777,size=64m
      - /var/tmp:mode=1777,size=16m
      # frontend files are copied here by the entrypoint on every start.
      # mode=1777 (world-writable) is required — the tmpfs is owned by root
      # but the container runs as the non-root tusshare user.
      - /app/frontend:mode=1777,size=32m
    read_only: true
    cap_drop:
      - ALL
      # No capabilities are re-added: the app runs as a non-root user (tusshare)
      # on port 8080 (> 1024, so NET_BIND_SERVICE is not required).
      # If you ever move to port 80/443 inside the container, add NET_BIND_SERVICE.
    environment:
      # First-run bootstrap: set TUSSHARE_SUPERUSER_URL in .env to create the
      # sensitive_config schema automatically on startup. Must use the postgres
      # superuser (not the app user — it lacks CREATEROLE).
      #
      # Add to .env before first startup, then remove — ignored once the schema
      # exists and safe to leave in if preferred (no effect after bootstrap).
      #
      # Example .env entry:
      #   TUSSHARE_SUPERUSER_URL=postgresql://postgres:${TUSSHARE_PG_SUPERUSER_PASSWORD}@postgres:5432/tusshare
      #
      # To bootstrap without restarting a running stack:
      #   TUSSHARE_SUPERUSER_URL=postgresql://postgres:${TUSSHARE_PG_SUPERUSER_PASSWORD}@postgres:5432/tusshare \
      #   docker compose run --rm tusshare \
      #   python -c "import asyncio,os; from pathlib import Path; \
      #   from app.sensitive_config import _bootstrap; \
      #   asyncio.run(_bootstrap(os.environ['TUSSHARE_SUPERUSER_URL'],'tusshare',Path('/data')))"
      TUSSHARE_SUPERUSER_URL: ${TUSSHARE_SUPERUSER_URL:-}
      # Route all normal app traffic through pgbouncer (transaction-mode pooling).
      # TUSSHARE_SUPERUSER_URL above still connects directly to postgres — it is
      # bootstrap-only and uses session-level operations unsuited to transaction mode.
      DATABASE_URL: postgresql://tusshare:${TUSSHARE_PG_PASSWORD:-changeme}@pgbouncer:6432/tusshare
    env_file:
      - .env
    depends_on:
      pgbouncer:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  tusshare_data:
    driver: local
  postgres_data:
    driver: local
