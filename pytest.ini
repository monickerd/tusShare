[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = tests/e2e tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Run test files in numeric order (test_00, test_01, ...)
# so the bootstrap group always runs first.
addopts =
    --tb=short
    -v

# Marks used across the suite — registered here to avoid PytestUnknownMarkWarning
markers =
    ldap: tests that require a running LDAP server
    oidc: tests that require a running OIDC/Dex server
    slow: tests that take more than a few seconds
    s3: tests that require a running S3-compatible storage backend
    azure: tests that require a running Azure Blob Storage emulator (Azurite)
