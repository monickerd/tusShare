<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="build-id" content="">
    <title>tusShare</title>
    <!-- Restore appearance from localStorage before CSS loads — prevents flash of wrong theme/size -->
    <script src="/js/theme-init.js"></script>
    <!-- Theme: default/colors.css now includes both dark (default) and light overrides -->
    <link rel="stylesheet" href="/themes/default/colors.css">
    <link rel="stylesheet" href="/themes/default/layout.css">
    <link rel="stylesheet" href="/themes/default/toast.css">
    <!-- App styles -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <div id="app">
        <div id="app-loading" class="loading-screen">
            <div class="loading-spinner"></div>
            <p>Loading tusShare...</p>
        </div>
    </div>

    <!-- Core modules loaded in dependency order -->
    <script defer src="/js/config.js"></script>
    <script defer src="/js/utils.js"></script>
    <script defer src="/js/transfer-manager.js"></script>
    <script defer src="/js/api.js"></script>
    <script defer src="/js/crypto.js"></script>
    <script defer src="/js/auth.js"></script>
    <script defer src="/js/files.js"></script>
    <script defer src="/js/upload.js"></script>
    <script defer src="/js/download.js"></script>
    <script defer src="/js/shares.js"></script>
    <script defer src="/js/teams.js"></script>
    <script defer src="/js/permissions.js"></script>
    <script defer src="/js/access_logs.js"></script>
    <script defer src="/js/admin.js"></script>
    <script defer src="/js/wizard.js"></script>
    <script defer src="/js/app.js"></script>
</body>
</html>
